on:
  push:
    branches: main
  pull_request:
    branches: main

name: Run govulncheck
jobs:
  govulncheck_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags uint256 -format json ./... > govulncheck.json
      - name: Fail on reachable vulnerabilities
        # no fix without forking cosmos-sdk (x/crypto/openpgp) or go-ethereum (pion/dtls/v2)
        # explicit bash adds pipefail, so a jq error isn't masked by sort
        shell: bash
        run: |
          jq -r 'select(.finding.trace[0].function) | .finding.osv' govulncheck.json | sort -u > found
          ! grep -vxE 'GO-2026-5932|GO-2026-4479' found
