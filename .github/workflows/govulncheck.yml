on:
  push:
    branches: main
  pull_request:
    branches: main

name: Run govulncheck
jobs:
  govulncheck_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags uint256 ./...
