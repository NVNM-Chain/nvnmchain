---
version: 2
project_name: inveniamd

builds:
  - id: inveniamd-darwin-amd64
    main: ./scripts/ci-goreleaser/goreleaser.go
    binary: inveniamd
    goos:
      - darwin
    goarch:
      - amd64
    hooks:
      post:
        - ./scripts/ci-goreleaser/.goreleaser_hook.sh {{ .Arch }} {{ .Os }} {{ .ProjectName }}

  - id: inveniamd-darwin-arm64
    main: ./scripts/ci-goreleaser/goreleaser.go
    binary: inveniamd
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      post:
        - ./scripts/ci-goreleaser/.goreleaser_hook.sh {{ .Arch }} {{ .Os }} {{ .ProjectName }}

  - id: inveniamd-linux-amd64
    main: ./scripts/ci-goreleaser/goreleaser.go
    binary: inveniamd
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      post:
        - ./scripts/ci-goreleaser/.goreleaser_hook.sh {{ .Arch }} {{ .Os }} {{ .ProjectName }}

  # TODO: skip arm64 build for now as ubuntu-24.04-arm is not running on private repo
  # - id: inveniamd-linux-arm64
  #   main: ./scripts/ci-goreleaser/goreleaser.go
  #   binary: inveniamd
  #   goos:
  #     - linux
  #   goarch:
  #     - arm64
  #   hooks:
  #     post:
  #       - ./scripts/ci-goreleaser/.goreleaser_hook.sh {{ .Arch }} {{ .Os }} {{ .ProjectName }}

archives:
  - id: zipped
    builds:
      - inveniamd-linux-amd64
      # - inveniamd-linux-arm64
      - inveniamd-darwin-amd64
      - inveniamd-darwin-arm64
    name_template: "{{.ProjectName}}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: tar.gz
    files:
      - none*
  - id: binaries
    builds:
      - inveniamd-linux-amd64
      # TODO: skip arm64 build for now as ubuntu-24.04-arm is not running on private repo
      # - inveniamd-linux-arm64
      - inveniamd-darwin-amd64
      - inveniamd-darwin-arm64
    name_template: "{{.ProjectName}}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: binary
    files:
      - none*

checksum:
  name_template: "sha256sum.txt"
  algorithm: sha256

# Docs: https://goreleaser.com/customization/changelog/
changelog:
  disable: true

# Docs: https://goreleaser.com/customization/release/
release:
  github:
    owner: "{{ .Env.REPO_OWNER }}"
    name: "{{ .Env.REPO_NAME }}"
  replace_existing_draft: true
  header: |
    < DESCRIPTION OF RELEASE >

    ## Changelog

    See the full changelog [here](https://github.com/{{ .Env.REPO_OWNER }}/{{ .Env.REPO_NAME }}/blob/v{{ .Version }}/CHANGELOG.md)

    #### 🔨 Build from source

    If you prefer to build from source, you can use the following commands:

    ````bash
    git clone https://github.com/{{ .Env.REPO_OWNER }}/{{ .Env.REPO_NAME }}
    cd inveniam && git checkout v{{ .Version }}
    make install
    ````

  name_template: "Inveniam v{{.Version}}"
  mode: replace
  draft: true

