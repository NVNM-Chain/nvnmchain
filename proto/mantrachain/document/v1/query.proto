syntax = "proto3";
package mantrachain.document.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "mantrachain/document/v1/params.proto";
import "mantrachain/document/v1/document.proto";

option go_package = "github.com/MANTRA-Chain/inveniam/x/document/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/MANTRA-Chain/inveniam/document/v1/params";
  }

  // Documents queries documents by denom and index.
  rpc Documents(QueryDocumentsRequest)
      returns (QueryDocumentsResponse) {
    option (google.api.http).get =
        "/MANTRA-Chain/inveniam/document/{denom}/{index}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryDocumentsRequest is request type for the Query/Documents RPC method.
message QueryDocumentsRequest {
  string denom = 1;
  uint64 index = 2;
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

// QueryDocumentsResponse is response type for the Query/Documents RPC method.
message QueryDocumentsResponse {
  // documents is a list of documents
  repeated Document documents = 1;
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
} 