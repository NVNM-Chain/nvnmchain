syntax = "proto3";
package mantrachain.document.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "mantrachain/document/v1/params.proto";
import "mantrachain/document/v1/document.proto";

option go_package = "github.com/MANTRA-Chain/inveniam/x/document/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // AddDocument defines a method for adding a document to a token denom
  rpc AddDocument(MsgAddDocument) returns (MsgAddDocumentResponse);

  // RemoveDocument defines a method for removing a document from a token denom
  rpc RemoveDocument(MsgRemoveDocument) returns (MsgRemoveDocumentResponse);

  // GrantRole defines a method for granting a role to an address
  rpc GrantRole(MsgGrantRole) returns (MsgGrantRoleResponse);

  // RevokeRole defines a method for revoking a role from an address
  rpc RevokeRole(MsgRevokeRole) returns (MsgRevokeRoleResponse);
}
// MsgGrantRole is the Msg/GrantRole request type.
message MsgGrantRole {
  option (amino.name) = "inveniam/x/document/MsgGrantRole";
  option (cosmos.msg.v1.signer) = "admin";

  // admin is the address that grants the role.
  string admin = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // address to grant role to
  string address = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // role to grant (e.g., "admin", "editor")
  string role = 3;
}

message MsgGrantRoleResponse {}

// MsgRevokeRole is the Msg/RevokeRole request type.
message MsgRevokeRole {
  option (amino.name) = "inveniam/x/document/MsgRevokeRole";
  option (cosmos.msg.v1.signer) = "admin";

  // admin is the address that revokes the role.
  string admin = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // address to revoke role from
  string address = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // role to revoke (e.g., "admin", "editor")
  string role = 3;
}

message MsgRevokeRoleResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (amino.name) = "inveniam/x/document/MsgUpdateParams";
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module parameters.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string admin = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgAddDocument {
  option (amino.name) = "inveniam/x/document/MsgAddDocument";
  option (cosmos.msg.v1.signer) = "sender";

  // sender is the address that sends the document addition request.
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  Document document = 2;
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgAddDocumentResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgRemoveDocument {
  option (amino.name) = "inveniam/x/document/MsgRemoveDocument";
  option (cosmos.msg.v1.signer) = "sender";
  // sender is the address that sends the document removal request.
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string denom = 2;
  uint64 index = 3;
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgRemoveDocumentResponse {}