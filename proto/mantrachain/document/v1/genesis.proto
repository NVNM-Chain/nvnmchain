syntax = "proto3";
package mantrachain.document.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "mantrachain/document/v1/params.proto";
import "mantrachain/document/v1/document.proto";

option go_package = "github.com/MANTRA-Chain/inveniam/x/document/types";

// GenesisState defines the document module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];

  map<string, Document> documents = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
    
  map<string, uint64> document_counters = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}
