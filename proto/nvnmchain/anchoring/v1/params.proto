syntax = "proto3";
package nvnmchain.anchoring.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/NVNM-Chain/nvnmchain/x/anchoring/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "nvnmchain/x/anchoring/Params";
  option (gogoproto.equal) = true;

  string admin = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (amino.dont_omitempty) = true
  ];

  // anchoring_fee is the per-tx fee cap for direct anchoring traffic. When the
  // natural gas-based fee exceeds this amount, the chain refunds the overage
  // in PostHandler. Applies to single-msg MsgAddRecord txs and direct EVM
  // precompile calls (tx.to == AnchoringPrecompileAddress). Contract-wrapped
  // precompile calls are unaffected.
  cosmos.base.v1beta1.Coin anchoring_fee = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
